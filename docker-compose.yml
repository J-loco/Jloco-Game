# StarLoco stack. Secrets come from .env (copy .env.example); server settings from config/*.properties.
#
#   docker compose up -d                       game + website (everything below except the tools)
#   docker compose up -d starloco_game         game only: MariaDB and login start with it
#   docker compose build starloco_game         after changing Java code (scripts/ is mounted: a restart is enough)
#
# Opt-in tools use profiles and never start with "up": see the TOOLS section.

x-web-runtime: &web-runtime
  image: starloco/web:local
  build:
    context: ../StarLoco-Web
    target: runtime
  networks:
    - starloco
  volumes:
    - ../StarLoco-Web:/var/www/starloco-web

services:
  # ==================================================================================================
  # GAME: required to play
  # ==================================================================================================

  # Login and game databases (starloco_login, starloco_game), seeded from db-init/ on an empty volume.
  starloco_mariadb:
    image: mariadb:11.3
    restart: always
    networks:
      - starloco
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in StarLoco-Game/.env (see .env.example)}
    volumes:
      - db-sql:/var/lib/mysql
      - ./db-init/:/docker-entrypoint-initdb.d/:ro
    # healthcheck.sh --connect uses TCP, which stays off while db-init/*.sql is imported on an empty volume,
    # so dependents never start against a half-loaded database (a socket ping already answers then).
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 20s
      retries: 10
      start_period: 15m

  # Login server: clients on 450, game servers on the private exchange port 666.
  starloco_login:
    # Built from StarLoco-Login (Java 21; formatting, static analysis and unit tests run during the build).
    # It speaks exchange protocol v2: the game server must be built from the same revision (starloco_game
    # builds its jar inside the image). Healthcheck: see its Dockerfile.
    image: starloco/login:local
    build:
      context: ../StarLoco-Login
    restart: always
    networks:
      - starloco
    ports:
      - "450:450"
      - "127.0.0.1:666:666"
    volumes:
      - ./config/login.config.properties:/app/login.config.properties
    depends_on:
      starloco_mariadb:
        condition: service_healthy

  # Game server (built from this directory, see docker/Dockerfile).
  starloco_game:
    image: starloco/game:latest
    build:
      context: .
      dockerfile: ./docker/Dockerfile
    restart: always
    # On stop, the server disconnects everyone and saves the world: leave it time before SIGKILL.
    stop_grace_period: 1m
    networks:
      - starloco
    ports:
      - "5555:5555"
    volumes:
      - ./config/:/app/config
      - ./scripts:/app/scripts
    depends_on:
      starloco_mariadb:
        condition: service_healthy
      starloco_login:
        condition: service_healthy

  # ==================================================================================================
  # WEBSITE: registration, shop, launcher endpoints and client data (lang/), at http://127.0.0.1/dofus
  # Not needed by the servers; the client falls back to its local data/ when the site is down.
  # ==================================================================================================

  starloco_web:
    <<: *web-runtime
    restart: always
    ports:
      - "127.0.0.1:80:80"
    environment:
      APP_URL: ${WEB_APP_URL:-http://127.0.0.1/dofus/}
      APP_BASE_PATH: ${WEB_APP_BASE_PATH:-/dofus}
      APP_DEBUG: ${WEB_APP_DEBUG:-0}
      TRUST_CLOUDFLARE: ${WEB_TRUST_CLOUDFLARE:-0}
      SITE_NAME: ${WEB_SITE_NAME:-StarLoco}
      ADMIN_ACCOUNT_ID: ${WEB_ADMIN_ACCOUNT_ID:-1}
      DB_HOST: starloco_mariadb
      # Least-privilege account created by starloco_web_migrate (never root).
      DB_USER: starloco_web
      DB_PASS: ${WEB_DB_PASSWORD:?set WEB_DB_PASSWORD in StarLoco-Game/.env (see .env.example)}
      LOGIN_HOST: starloco_login
      GAME_HOST: starloco_game
      GAME_SERVER_ID: ${WEB_GAME_SERVER_ID:-601}
      FORUM_URL: ${WEB_FORUM_URL:-}
      FORUM_RSS_URL: ${WEB_FORUM_RSS_URL:-}
      DOWNLOAD_URL: ${WEB_DOWNLOAD_URL:-}
      VOTE_URL: ${WEB_VOTE_URL:-https://www.rpg-paradize.com/}
      VOTE_POINTS: ${WEB_VOTE_POINTS:-5}
      DEDIPASS_PUBLIC_KEY: ${WEB_DEDIPASS_PUBLIC_KEY:-}
      SHOP_SERVERS: ${WEB_SHOP_SERVERS:-1:starloco_game}
      PASSWORD_HASH_SCHEME: ${WEB_PASSWORD_HASH_SCHEME:-legacy}
      MAILER_DSN: ${WEB_MAILER_DSN:-}
      MAIL_FROM: ${WEB_MAIL_FROM:-}
    depends_on:
      starloco_web_migrate:
        condition: service_completed_successfully
      starloco_web_assets:
        condition: service_completed_successfully

  # One-off: applies StarLoco-Web/migrations and provisions the starloco_web DB user, then exits.
  # Re-run by hand with: docker compose run --rm starloco_web_migrate
  starloco_web_migrate:
    <<: *web-runtime
    restart: "no"
    command: ["php", "bin/migrate"]
    environment:
      DB_HOST: starloco_mariadb
      DB_USER: root
      DB_PASS: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in StarLoco-Game/.env (see .env.example)}
      WEB_DB_USER: starloco_web
      WEB_DB_PASSWORD: ${WEB_DB_PASSWORD:?set WEB_DB_PASSWORD in StarLoco-Game/.env (see .env.example)}
      # The portal user also gets write access to gifts in every shop game database.
      SHOP_SERVERS: ${WEB_SHOP_SERVERS:-1:starloco_game}
    depends_on:
      starloco_mariadb:
        condition: service_healthy

  # One-off: builds StarLoco-Web/public/assets/app.css with Tailwind, then exits.
  # Rebuild after editing templates: docker compose run --rm starloco_web_assets
  starloco_web_assets:
    image: starloco/web-assets:local
    build:
      context: ../StarLoco-Web
      target: tailwind
    restart: "no"
    volumes:
      - ../StarLoco-Web:/app

  # ==================================================================================================
  # TOOLS: opt-in, started only through their profile or "docker compose run"
  # ==================================================================================================

  # Portal developer tools: docker compose run --rm starloco_web_tools <composer script>
  # e.g. check (everything CI runs), test, test:unit, stan, cs, cs:fix, rector
  starloco_web_tools:
    image: starloco/web-dev:local
    build:
      context: ../StarLoco-Web
      target: dev
    profiles: ["tools"]
    networks:
      - starloco
    volumes:
      - ../StarLoco-Web:/var/www/starloco-web
      # Source of truth of the XP tables: composer experience:check / experience:sync
      - ./scripts/data/Experience.lua:/opt/starloco-game/Experience.lua:ro
    environment:
      EXPERIENCE_LUA: /opt/starloco-game/Experience.lua
      # Portal database, for scripts such as item-sprites.
      DB_HOST: starloco_mariadb
      DB_USER: starloco_web
      DB_PASS: ${WEB_DB_PASSWORD:?set WEB_DB_PASSWORD in StarLoco-Game/.env (see .env.example)}
      # Integration tests create and drop starloco_login_test / starloco_game_test.
      TEST_DB_HOST: starloco_mariadb
      TEST_DB_USER: root
      TEST_DB_PASS: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in StarLoco-Game/.env (see .env.example)}

  # Shop item images from the client sprites:
  #   docker compose run --rm starloco_web_tools item-sprites   # list what the shop sells
  #   docker compose run --rm starloco_web_sprites              # render public/assets/img/items (--force to redo)
  starloco_web_sprites:
    image: starloco/web-sprites:local
    build:
      context: ../StarLoco-Web
      target: sprites
    profiles: ["tools"]
    volumes:
      - ../StarLoco-Web:/app
      - ../StarLoco-Client/resources/app/retroclient/clips/items:/clips:ro

  # Development mail catcher, UI at http://127.0.0.1:8025:
  #   docker compose --profile mail up -d starloco_mailpit
  # with WEB_MAILER_DSN=smtp://starloco_mailpit:1025 and WEB_MAIL_FROM=noreply@starloco.local in .env
  starloco_mailpit:
    image: axllent/mailpit:v1.31.1
    profiles: ["mail"]
    restart: unless-stopped
    networks:
      - starloco
    ports:
      - "127.0.0.1:8025:8025"

  # Redis: no server uses it (the game dropped its unused Jedis dependency). Kept for future use:
  #   docker compose --profile redis up -d starloco_redis
  starloco_redis:
    # Use image redis/redis-stack-server in production
    image: "redis/redis-stack"
    profiles: ["redis"]
    restart: always
    networks:
      - starloco
    ports:
      - "127.0.0.1:6379:6379"
    environment:
      # Snapshot to disk every minute, or every 1000 writes. Also write the AOF to make sure we don't lose any data
      REDIS_ARG: "--save 60 1000 --appendonly yes"
    volumes:
      - "db-game:/data/"

networks:
  starloco:

volumes:
  db-sql:
  db-game:
