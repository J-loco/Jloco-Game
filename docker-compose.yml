services:
  # Game Database
  starloco_redis:
    # Use image redis/redis-stack-server in production
    image: "redis/redis-stack"
    restart: always
    networks:
      - starloco
    ports:
      - "127.0.0.1:6379:6379"
    environment:
      # Snapshot to disk every minute, or every 1000 writes. Also write the AOF to make sure we don't lose any data
      REDIS_ARG: "--save 60 1000 --appendonly yes"
    volumes:
      - "db-game:/data/"
  # SQL Database
  starloco_mariadb:
    image: mariadb:11.3
    restart: always
    networks:
      - starloco
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in StarLoco-Game/.env (see .env.example)}
    ports:
      - '127.0.0.1:3306:3306'
    volumes:
      - db-sql:/var/lib/mysql
      - ./db-init/:/docker-entrypoint-initdb.d/:ro
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      timeout: 20s
      retries: 10
  # Web portal + Flash data server (serves StarLoco-Web at http://127.0.0.1/dofus)
  starloco_web:
    image: starloco/web:local
    build:
      context: ../StarLoco-Web
    restart: always
    networks:
      - starloco
    ports:
      - '127.0.0.1:80:80'
    volumes:
      - ../StarLoco-Web:/var/www/html/dofus
    environment:
      DB_HOST: starloco_mariadb
      # Least-privilege account created by starloco_web_migrate (never root).
      DB_USER: starloco_web
      DB_PASS: ${WEB_DB_PASSWORD:?set WEB_DB_PASSWORD in StarLoco-Game/.env (see .env.example)}
      LOGIN_HOST: starloco_login
      GAME_HOST: starloco_game
      APP_URL: ${WEB_APP_URL:-http://127.0.0.1/dofus/}
      APP_DEBUG: ${WEB_APP_DEBUG:-0}
      TRUST_CLOUDFLARE: ${WEB_TRUST_CLOUDFLARE:-0}
      DEDIPASS_PUBLIC_KEY: ${WEB_DEDIPASS_PUBLIC_KEY:-}
    depends_on:
      starloco_web_migrate:
        condition: service_completed_successfully
  # One-off: applies StarLoco-Web/migrations and provisions the starloco_web DB user, then exits.
  # Re-run by hand with: docker compose run --rm starloco_web_migrate
  starloco_web_migrate:
    image: starloco/web:local
    build:
      context: ../StarLoco-Web
    restart: "no"
    networks:
      - starloco
    volumes:
      - ../StarLoco-Web:/var/www/html/dofus
    command: ["php", "bin/migrate"]
    environment:
      DB_HOST: starloco_mariadb
      DB_USER: root
      DB_PASS: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in StarLoco-Game/.env (see .env.example)}
      WEB_DB_USER: starloco_web
      WEB_DB_PASSWORD: ${WEB_DB_PASSWORD:?set WEB_DB_PASSWORD in StarLoco-Game/.env (see .env.example)}
    depends_on:
      starloco_mariadb:
        condition: service_healthy
  # Login
  starloco_login:
#    image: starloco/login:latest
    build:
      context: ../StarLoco-Web
    restart: always
    networks:
      - starloco
    ports:
      - '450:450'
      - '127.0.0.1:666:666'
    volumes:
      - ./config/login.config.properties:/app/login.config.properties
    depends_on:
      starloco_mariadb:
        condition: service_healthy
  # Game
  starloco_game:
    image: starloco/game:latest
    build:
      context: .
      dockerfile: ./docker/Dockerfile
    restart: always
    networks:
      - starloco
    ports:
      - '5555:5555'
    volumes:
      - ./config/:/app/config
      - ./scripts:/app/scripts
    depends_on:
      starloco_redis:
        condition: service_started
      starloco_mariadb:
        condition: service_healthy

networks:
  starloco:

volumes:
  db-sql:
  db-game: